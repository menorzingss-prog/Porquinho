<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo &amp; Aulas">
<title>Tempo &amp; Aulas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#7c3aed;--p2:#6d28d9;--pl:#a78bfa;--bg:#14111c;--card:#211d2b;--card2:#16131e;--ink:#f4f1fa;--mut:#9a93aa;--line:#2f2a3b;--red:#ff6b6b;--ok:#4ade80}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#strip{flex:none;background:linear-gradient(135deg,#6d28d9,#8b3cf0);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:6px;z-index:5}
#strip button{flex:1;border:0;border-radius:12px;padding:9px 4px;background:rgba(255,255,255,.14);color:#ffffffcc;font:inherit;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#strip button.on{background:#fff;color:#5b21b6}
#stage{flex:1;position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#stage iframe.on{display:block}
#homeView{position:absolute;inset:0;overflow:auto;display:none;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
#homeView.on{display:block}
.wrap{max-width:640px;margin:0 auto}
.hero{background:var(--card);border-radius:28px;padding:22px 20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hero small{color:var(--mut);font-size:.95rem}
.hero h1{margin:4px 0 14px;font-size:1.6rem;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border-radius:18px;padding:13px 14px}
.tile small{display:block;color:var(--mut);font-size:.82rem}
.tile b{display:block;font-size:1.1rem;margin-top:4px;font-weight:800}
.tile b.red{color:var(--red)}.tile b.ok{color:var(--ok)}
.mod{background:var(--card);border-radius:26px;padding:18px;margin-bottom:14px}
.mod h2{margin:0 0 4px;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.mod p{margin:0 0 12px;color:var(--mut);font-size:.92rem}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;border-radius:16px;padding:14px;font:inherit;font-size:1rem;font-weight:700;background:var(--p2);color:#fff}
.btn.sec{background:#2d2640;color:#d8ccf5}
.note{color:var(--mut);font-size:.82rem;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="shell">
  <div id="strip">
    <button data-tab="home" class="on">🏠 Início</button>
    <button data-tab="aulas">🎾 Aulas</button>
    <button data-tab="tempo">🐷 Meu Tempo</button>
  </div>
  <div id="stage">
    <div id="homeView" class="on"><div class="wrap" id="homeBody"></div></div>
  </div>
</div>

lor:var(--pl)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader id=\"top\">\u003c/header>\n\u003cmain id=\"view\">\u003c/main>\n\u003cnav id=\"nav\">\n  \u003ca href=\"#/\" data-tab=\"home\">\u003cspan>🏠\u003c/span>Início\u003c/a>\n  \u003ca href=\"#/alunos\" data-tab=\"alunos\">\u003cspan>👥\u003c/span>Alunos\u003c/a>\n  \u003ca href=\"#/resumo\" data-tab=\"resumo\">\u003cspan>📊\u003c/span>Resumo\u003c/a>\n\u003c/nav>\n\u003cbutton id=\"fab\" data-act=\"newStudent\" aria-label=\"Novo aluno\" hidden>＋\u003c/button>\n\u003cdiv id=\"overlay\" hidden>\u003c/div>\n\u003cdiv id=\"toast\" hidden>\u003c/div>\n\u003cscript>/* Lógica pura (sem DOM): dinheiro em centavos, saldos e totais. */\n(function (root) {\n  var L = {};\n\n  L.DAYS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];\n\n  // \"10\", \"10,5\", \"1.250,00\", \"R$ 10,00\" -> centavos (inteiro). Inválido -> NaN\n  L.parseMoney = function (s) {\n    if (typeof s === 'number') return Math.round(s * 100);\n    s = String(s == null ? '' : s).trim().replace(/R\\$/i, '').replace(/\\s/g, '');\n    if (!s) return NaN;\n    if (s.indexOf(',') >= 0) s = s.replace(/\\./g, '').replace(',', '.');\n    if (!/^\\d+(\\.\\d{1,2})?$/.test(s)) return NaN;\n    return Math.round(parseFloat(s) * 100);\n  };\n\n  L.fmt = function (c) {\n    c = Math.round(c || 0);\n    var neg = c \u003c 0;\n    c = Math.abs(c);\n    var reais = String(Math.floor(c / 100)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    var cent = ('0' + (c % 100)).slice(-2);\n    return (neg ? '-' : '') + 'R$ ' + reais + ',' + cent;\n  };\n\n  // Datas como texto local AAAA-MM-DD\n  L.dateStr = function (d) {\n    d = d || new Date();\n    var m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);\n    return d.getFullYear() + '-' + m + '-' + day;\n  };\n  L.parseDate = function (s) {\n    var p = s.split('-');\n    return new Date(+p[0], +p[1] - 1, +p[2]);\n  };\n  L.fmtDate = function (s) {\n    var p = s.split('-');\n    return p[2] + '/' + p[1] + '/' + p[0];\n  };\n  L.weekRange = function (now) { // segunda a domingo\n    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n    var off = (d.getDay() + 6) % 7;\n    var start = new Date(d); start.setDate(d.getDate() - off);\n    var end = new Date(start); end.setDate(start.getDate() + 6);\n    return [L.dateStr(start), L.dateStr(end)];\n  };\n  L.monthRange = function (now) {\n    var s = new Date(now.getFullYear(), now.getMonth(), 1);\n    var e = new Date(now.getFullYear(), now.getMonth() + 1, 0);\n    return [L.dateStr(s), L.dateStr(e)];\n  };\n\n  // ---- Saldos. state = {students:[], classes:[], entries:[]} ----\n  // entry: {id, studentId, type:'debt'|'payment', amount(centavos>0), date, note, method}\n  L.balance = function (st, studentId) {\n    var b = 0;\n    st.entries.forEach(function (e) {\n      if (e.studentId !== studentId) return;\n      if (e.type === 'debt') b += e.amount; else if (e.type === 'payment') b -= e.amount; else if (e.type === 'use') b -= e.settled || 0;\n    });\n    return b; // negativo = crédito\n  };\n  L.pending = function (st, studentId) { return Math.max(0, L.balance(st, studentId)); };\n\n  L.classPending = function (st, cls) {\n    return cls.studentIds.reduce(function (t, id) { return t + L.pending(st, id); }, 0);\n  };\n  L.dayPending = function (st, day) { // alunos únicos do dia (sem duplicar)\n    var seen = {};\n    st.classes.forEach(function (c) {\n      if (c.day === day) c.studentIds.forEach(function (id) { seen[id] = 1; });\n    });\n    return Object.keys(seen).reduce(function (t, id) { return t + L.pending(st, id); }, 0);\n  };\n  L.totalPending = function (st) {\n    return st.students.reduce(function (t, s) { return t + L.pending(st, s.id); }, 0);\n  };\n  L.received = function (st, from, to) {\n    return st.entries.reduce(function (t, e) {\n      return (e.type === 'payment' || e.type === 'pack') && e.date >= from && e.date \u003c= to ? t + e.amount : t;\n    }, 0);\n  };\n  L.lastPayment = function (st, studentId) {\n    var last = null;\n    st.entries.forEach(function (e) {\n      if (e.studentId === studentId && (e.type === 'payment' || e.type === 'pack') && (!last || e.date > last)) last = e.date;\n    });\n    return last;\n  };\n\n  // Aulas pagas: compradas (pack) menos aulas dadas (use)\n  L.credits = function (st, studentId) {\n    var c = 0;\n    st.entries.forEach(function (e) {\n      if (e.studentId !== studentId) return;\n      if (e.type === 'pack') c += e.qty || 0;\n      else if (e.type === 'use') c -= e.qty || 1;\n    });\n    return c;\n  };\n\n  if (typeof module !== 'undefined' && module.exports) module.exports = L;\n  else root.L = L;\n})(typeof self !== 'undefined' ? self : this);\n\n/* Minhas Aulas — app principal. Dados salvos em localStorage (persistente, offline). */\n(function () {\n  'use strict';\n  var KEY = 'minhas-aulas-v1';\n  var $ = function (s) { return document.querySelector(s); };\n  var view = $('#view'), top = $('#top'), overlay = $('#overlay');\n\n  // ---------- Estado e persistência ----------\n  var st = load();\n  function load() {\n    try {\n      var d = JSON.parse(localStorage.getItem(KEY));\n      if (d && d.students && d.classes && d.entries) { if (!d.hiddenDays) d.hiddenDays = []; if (!d.price) d.price = 1000; return d; }\n    } catch (e) {}\n    return { students: [], classes: [], entries: [], hiddenDays: [], price: 1000 };\n  }\n  function save() {\n    try { localStorage.setItem(KEY, JSON.stringify(st)); }\n    catch (e) { toast('⚠️ Não foi possível salvar! Faça um backup.'); }\n  }\n  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }\n  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();\n\n  // ---------- Utilidades ----------\n  function esc(s) { return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n  function toast(m) { var t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }\n  function student(id) { return st.students.filter(function (s) { return s.id === id; })[0]; }\n  function cls(id) { return st.classes.filter(function (c) { return c.id === id; })[0]; }\n  function byName(a, b) { return a.name.localeCompare(b.name, 'pt-BR'); }\n  function badge(c) { return c > 0 ? '\u003cspan class=\"badge pend\">' + L.fmt(c) + ' pendente\u003c/span>' : '\u003cspan class=\"badge paid\">✓ Quitado\u003c/span>'; }\n  function classesOf(id) { return st.classes.filter(function (c) { return c.studentIds.indexOf(id) >= 0; }).sort(function (a, b) { return a.day - b.day || a.time.localeCompare(b.time); }); }\n\n  // ---------- Valores rápidos (botões que somam) ----------\n  function fmtIn(c) { return (c / 100).toFixed(2).replace('.', ','); }\n  function vchips(forId, all) {\n    return '\u003cdiv class=\"vc\" data-for=\"' + forId + '\">' + [5, 10, 15, 20, 50, 100].map(function (v) { return '\u003cbutton type=\"button\" data-v=\"' + v + '\">+' + v + '\u003c/button>'; }).join('') +\n      (all > 0 ? '\u003cbutton type=\"button\" class=\"all\" data-all=\"' + all + '\">Tudo\u003c/button>' : '') + '\u003cbutton type=\"button\" class=\"clr\" data-clr=\"1\">Limpar\u003c/button>\u003c/div>';\n  }\n  function qchips(forId) {\n    return '\u003cdiv class=\"vc\" data-qty=\"' + forId + '\">' + [1, 2, 4, 5, 8, 10].map(function (v) { return '\u003cbutton type=\"button\" data-v=\"' + v + '\">+' + v + '\u003c/button>'; }).join('') + '\u003cbutton type=\"button\" class=\"clr\" data-clr=\"1\">Limpar\u003c/button>\u003c/div>';\n  }\n  document.addEventListener('click', function (e) {\n    var b = e.target.closest('.vc button'); if (!b) return;\n    var box = b.parentNode, isQty = !!box.dataset.qty, inp = document.getElementById(box.dataset.qty || box.dataset.for); if (!inp) return;\n    var cur;\n    if (isQty) cur = parseInt(inp.value, 10) || 0;\n    else { cur = inp.dataset.fresh === '1' ? 0 : L.parseMoney(inp.value); if (isNaN(cur)) cur = 0; }\n    if (b.dataset.clr) inp.value = '';\n    else if (b.dataset.all) inp.value = fmtIn(+b.dataset.all);\n    else inp.value = isQty ? String(cur + (+b.dataset.v)) : fmtIn(cur + (+b.dataset.v) * 100);\n    inp.dataset.fresh = '0';\n    inp.dispatchEvent(new Event('input', { bubbles: true }));\n  });\n  document.addEventListener('input', function (e) { var t = e.target; if (t && t.dataset && t.dataset.fresh === '1') t.dataset.fresh = '0'; });\n\n  // ---------- Janelas (sheet) ----------\n  function sheet(html) {\n    overlay.innerHTML = '\u003cdiv class=\"sheet\">' + html + '\u003c/div>';\n    overlay.hidden = false;\n    var f = overlay.querySelector('input:not([type=date]):not([type=time])'); if (f && !overlay.querySelector('.vc[data-for=\"' + f.id + '\"], .vc[data-qty=\"' + f.id + '\"]')) setTimeout(function () { f.focus(); }, 50);\n  }\n  function closeSheet() { overlay.hidden = true; overlay.innerHTML = ''; }\n  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });\n  function confirmBox(msg, okLabel) {\n    return new Promise(function (res) {\n      sheet('\u003ch3>Confirmar\u003c/h3>\u003cp>' + esc(msg) + '\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"btn sec\" id=\"cn\">Cancelar\u003c/button>\u003cbutton class=\"btn red\" id=\"cy\">' + esc(okLabel || 'Confirmar') + '\u003c/button>\u003c/div>');\n      $('#cn').onclick = function () { closeSheet(); res(false); };\n      $('#cy').onclick = function () { closeSheet(); res(true); };\n    });\n  }\n\n  // ---------- Roteador ----------\n  function route() {\n    var h = cur.split('/').filter(Boolean);\n    closeSheet();\n    var tab = 'home';\n    if (h[0] === 'alunos' || h[0] === 'aluno') tab = 'alunos';\n    else if (h[0] === 'resumo') tab = 'resumo';\n    document.querySelectorAll('nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.tab === tab); });\n    $('#fab').hidden = !(!h.length || h[0] === 'alunos');\n    if (!h.length) return home();\n    if (h[0] === 'dia') return day(+h[1]);\n    if (h[0] === 'aula') return klass(h[1]);\n    if (h[0] === 'aluno') return studentPage(h[1]);\n    if (h[0] === 'alunos') return students();\n    if (h[0] === 'resumo') return summary();\n    home();\n  }\n  // Navegação interna (não depende de URL/hash: funciona também ao abrir o arquivo direto no celular)\n  var cur = '/', stack = [], pushOK = true;\n  try { if (location.hash.length > 2) cur = location.hash.slice(1); } catch (e) {}\n  function nav(p, replace) {\n    if (!replace) { stack.push(cur); try { history.pushState({}, ''); } catch (e) { pushOK = false; } }\n    cur = p; route(); window.scrollTo(0, 0);\n  }\n  function popNav() { cur = stack.length ? stack.pop() : '/'; route(); window.scrollTo(0, 0); }\n  window.addEventListener('popstate', popNav);\n  window.addEventListener('hashchange', function () { cur = location.hash.slice(1) || '/'; route(); });\n  function header(title, back, extra, big) {\n    top.className = big ? 'big' : '';\n    top.innerHTML = (back ? '\u003cbutton data-act=\"back\" aria-label=\"Voltar\">←\u003c/button>' : '') +\n      '\u003cdiv class=\"ht\">' + (big ? '\u003csmall>Seu dinheiro em dia.\u003c/small>' : '') + '\u003ch1>' + esc(title) + '\u003c/h1>\u003c/div>' +\n      (big ? '\u003cdiv class=\"logo\">🎾\u003c/div>' : (extra || ''));\n  }\n  function back() { if (pushOK && stack.length) history.back(); else popNav(); }\n\n  // ---------- Telas ----------\n  function tiles(arr) {\n    return '\u003cdiv class=\"tiles\">' + arr.map(function (x) { return '\u003cdiv class=\"tile\">\u003csmall>' + x[0] + '\u003c/small>\u003cb>' + x[1] + '\u003c/b>\u003c/div>'; }).join('') + '\u003c/div>';\n  }\n  function home() {\n    header('Minhas Aulas', false, null, true);\n    var now = new Date(), t = L. eStr(), note: 'Valor inicial', method: '' });\n        }\n        st.classes.forEach(function (c) {\n          var has = c.studentIds.indexOf(target.id) >= 0, want = picked.indexOf(c.id) >= 0;\n          if (want && !has) c.studentIds.push(target.id);\n          if (!want && has) c.studentIds = c.studentIds.filter(function (i) { return i !== target.id; });\n        });\n        save(); closeSheet(); route(); toast('Aluno salvo ✓');\n      }\n      if (dup) confirmBox('Já existe um aluno chamado “' + name + '”. Criar mesmo assim?', 'Criar').then(function (y) { if (y) go(); }); else go();\n    };\n    if (s) $('#del').onclick = function () {\n      var n = st.entries.filter(function (e) { return e.studentId === s.id; }).length;\n      confirmBox('Excluir ' + s.name + '? Isso apaga também ' + n + ' registro(s) de dívidas e pagamentos. Não dá para desfazer.', 'Excluir tudo').then(function (y) {\n        if (!y) return;\n        st.students = st.students.filter(function (x) { return x.id !== s.id; });\n        st.entries = st.entries.filter(function (e) { return e.studentId !== s.id; });\n        st.classes.forEach(function (c) { c.studentIds = c.studentIds.filter(function (i) { return i !== s.id; }); });\n        save(); nav('/alunos', true); toast('Aluno excluído');\n      });\n    };\n  }\n\n  function addToClass(cid) {\n    var c = cls(cid);\n    var avail = st.students.filter(function (s) { return c.studentIds.indexOf(s.id) \u003c 0; }).sort(byName);\n    var h = '\u003ch3>Adicionar aluno\u003c/h3>\u003cbutton class=\"btn\" id=\"nw\">＋ Cadastrar novo aluno\u003c/button>';\n    if (avail.length) {\n      h += '\u003clabel>Ou escolher aluno já cadastrado\u003c/label>\u003cinput id=\"sq\" placeholder=\"🔍 Pesquisar\" autocomplete=\"off\">\u003cdiv id=\"sl\">\u003c/div>';\n    }\n    h += '\u003cbutton class=\"btn sec\" id=\"cn\">Fechar\u003c/button>';\n    sheet(h);\n    $('#cn').onclick = closeSheet;\n    $('#nw').onclick = function () { studentForm(null, cid); };\n    function rl() {\n      var q = ($('#sq').value || '').toLowerCase();\n      $('#sl').innerHTML = avail.filter(function (s) { return s.name.toLowerCase().indexOf(q) >= 0; }).map(function (s) {\n        return '\u003cbutton class=\"hist\" data-pick=\"' + s.id + '\">\u003cb>' + esc(s.name) + '\u003c/b>\u003c/button>';\n      }).join('') || '\u003cdiv class=\"s\">Ninguém encontrado\u003c/div>';\n    }\n    if (avail.length) {\n      rl(); $('#sq').addEventListener('input', rl);\n      $('#sl').addEventListener('click', function (e) {\n        var b = e.target.closest('[data-pick]'); if (!b) return;\n        c.studentIds.push(b.dataset.pick); save(); closeSheet(); route(); toast('Aluno adicionado ✓');\n      });\n    }\n  }\n\n  // Pagamento / dívida\n  function entryForm(kind, sid, entry) {\n    var s = student(sid), isPay = kind === 'payment';\n    var p = L.pending(st, sid);\n    var amountVal = entry ? (entry.amount / 100).toFixed(2).replace('.', ',') : (isPay && p > 0 ? (p / 100).toFixed(2).replace('.', ',') : '');\n    var h = '\u003ch3>' + (entry ? 'Editar registro' : isPay ? 'Pagamento — ' + esc(s.name) : 'Nova dívida — ' + esc(s.name)) + '\u003c/h3>';\n    if (isPay && !entry) h += '\u003cdiv class=\"s\" style=\"margin-bottom:8px\">Saldo pendente: \u003cb>' + L.fmt(p) + '\u003c/b>\u003c/div>';\n    h += '\u003clabel>Valor (R$)\u003c/label>\u003cinput id=\"fa\" inputmode=\"decimal\" placeholder=\"0,00\" value=\"' + amountVal + '\" autocomplete=\"off\"' + (!entry && isPay && p > 0 ? ' data-fresh=\"1\"' : '') + '>' + vchips('fa', !entry && isPay ? p : 0);\n    if (isPay) h += '\u003clabel>Forma de pagamento\u003c/label>\u003cselect id=\"fm\">' + ['Pix', 'Dinheiro', 'Cartão', 'Outro'].map(function (m) { return '\u003coption' + (entry && entry.method === m ? ' selected' : '') + '>' + m + '\u003c/option>'; }).join('') + '\u003c/select>';\n    h += '\u003clabel>Data\u003c/label>\u003cinput id=\"fdt\" type=\"date\" value=\"' + (entry ? entry.date : L.dateStr()) + '\" max=\"2100-01-01\">' +\n      '\u003clabel>Observação (opcional)\u003c/label>\u003cinput id=\"fo\" maxlength=\"80\" value=\"' + esc(entry ? entry.note : '') + '\">' +\n      '\u003cbutton class=\"btn\" id=\"ok\">Salvar\u003c/button>' + (entry ? '\u003cbutton class=\"btn red\" id=\"del\">🗑 Excluir registro\u003c/button>' : '') + '\u003cbutton class=\"btn sec\" id=\"cn\">Cancelar\u003c/button>';\n    sheet(h);\n    $('#cn').onclick = closeSheet;\n    var busy = false;\n    $('#ok').onclick = function () {\n      if (busy) return;\n      var amt = L.parseMoney($('#fa').value);\n      if (isNaN(amt) || amt \u003c= 0) return toast('Digite um valor maior que zero');\n      if (amt > 100000000) return toast('Valor muito alto');\n      var date = $('#fdt').value; if (!date) return toast('Informe a data');\n      function go() {\n        if (busy) return; busy = true;\n        var note = $('#fo').value.trim(), method = isPay ? $('#fm').value : '';\n        if (entry) { entry.amount = amt; entry.date = date; entry.note = note; entry.method = method; }\n        else st.entries.push({ id: uid(), studentId: sid, type: kind, amount: amt, date: date, note: note, method: method });\n        save(); closeSheet(); route(); toast(isPay ? 'Pagamento registrado ✓' : 'Dívida registrada ✓');\n      }\n      if (isPay) {\n        var base = entry ? L.balance(st, sid) + entry.amount : L.balance(st, sid); // saldo sem este registro\n        if (amt > Math.max(0, base)) {\n          return confirmBox('O valor (' + L.fmt(amt) + ') é maior que o saldo pendente (' + L.fmt(Math.max(0, base)) + '). Registrar mesmo assim? A diferença ficará como crédito.', 'Registrar').then(function (y) { if (y) go(); });\n        }\n      }\n      go();\n    };\n    if (entry) $('#del').onclick = function () {\n      confirmBox('Excluir este registro de ' + L.fmt(entry.amount) + '? O saldo será recalculado.', 'Excluir').then(function (y) {\n        if (!y) return;\n        st.entries = st.entries.filter(function (e) { return e.id !== entry.id; });\n        save(); route(); toast('Registro excluído');\n      });\n    };\n  }\n\n  // ---------- Aulas pagas ----------\n  function packForm(sid) {\n    var s = student(sid); if (!s) return;\n    sheet('\u003ch3>🎟 Aulas pagas — ' + esc(s.name) + '\u003c/h3>\u003cdiv class=\"s\" style=\"margin-bottom:8px\">Aulas pagas agora: \u003cb>' + L.credits(st, sid) + '\u003c/b>\u003c/div>' +\n      '\u003clabel>Quantas aulas?\u003c/label>\u003cinput id=\"pq\" inputmode=\"numeric\" placeholder=\"0\" autocomplete=\"off\">' + qchips('pq') +\n      '\u003clabel>Valor de cada aula (R$)\u003c/label>\u003cinput id=\"pp\" inputmode=\"decimal\" value=\"' + fmtIn(st.price || 1000) + '\" autocomplete=\"off\">' +\n      '\u003clabel>Forma de pagamento\u003c/label>\u003cselect id=\"pm\">' + ['Pix', 'Dinheiro', 'Cartão', 'Outro'].map(function (m) { return '\u003coption>' + m + '\u003c/option>'; }).join('') + '\u003c/select>' +\n      '\u003cdiv class=\"total\" id=\"pt\">Total: R$ 0,00\u003c/div>' +\n      '\u003cbutton class=\"btn\" id=\"ok\">Registrar aulas pagas\u003c/button>\u003cbutton class=\"btn sec\" id=\"cn\">Cancelar\u003c/button>');\n    $('#cn').onclick = closeSheet;\n    function upd() { var q = parseInt($('#pq').value, 10) || 0, pr = L.parseMoney($('#pp').value); $('#pt').textContent = 'Total: ' + L.fmt(q > 0 && !isNaN(pr) ? q * pr : 0); }\n    $('#pq').addEventListener('input', upd); $('#pp').addEventListener('input', upd); upd();\n    var busy = false;\n    $('#ok').onclick = function () {\n      if (busy) return;\n      var q = parseInt($('#pq').value, 10), pr = L.parseMoney($('#pp').value);\n      if (!(q > 0)) return toast('Informe quantas aulas');\n      if (q > 500) return toast('Quantidade muito alta');\n      if (isNaN(pr) || pr \u003c= 0) return toast('Valor da aula inválido');\n      busy = true;\n      st.price = pr;\n      st.entries.push({ id: uid(), studentId: sid, type: 'pack', qty: q, amount: q * pr, date: L.dateStr(), note: '', method: $('#pm').value });\n      save(); closeSheet(); route(); toast(q + (q === 1 ? ' aula paga registrada ✓' : ' aulas pagas registradas ✓'));\n    };\n  }\n  function useEntry(sid) { var settled = Math.min(st.price || 1000, L.pending(st, sid)); return { id: uid(), studentId: sid, type: 'use', qty: 1, amount: 0, settled: settled, date: L.dateStr(), note: '', method: '' }; }\n  function giveClass(sid) {\n    var s = student(sid); if (!s) return;\n    var c = L.credits(st, sid), price = st.price || 1000;\n    if (c \u003c= 0) {\n      return confirmBox(s.name + ' está sem aulas pagas. Lançar esta aula como dívida de ' + L.fmt(price) + '?', 'Lançar dívida').then(function (y) {\n        if (!y) return;\n        st.entries.push({ id: uid(), studentId: sid, type: 'debt', amount: price, date: L.dateStr(), note: 'Aula', method: '' });\n        save(); route(); toast('Dívida lançada');\n      });\n    }\n    var before = L.pending(st, sid), ue = useEntry(sid);\n    st.entries.push(ue); save(); route();\n    toast('Aula dada ✓ — restam ' + (c - 1) + (c - 1 === 1 ? ' aula paga' : ' aulas pagas') + (ue.settled > 0 ? ' · dívida: ' + L.fmt(before - ue.settled) : ''));\n  }\n  function giveAll(cid) {\n    var c = cls(cid); if (!c) return;\n    var ok = [], no = [];\n    c.studentIds.map(student).filter(Boolean).forEach(function (s) { (L.credits(st, s.id) > 0 ? ok : no).push(s); });\n    if (!ok.length) return toast('Ninguém desta aula tem aulas pagas');\n    confirmBox('Dar aula para ' + ok.length + ' aluno(s), descontando 1 aula paga de cada?' + (no.length ? ' Ficam de fora (sem aulas pagas): ' + no.map(function (s) { return s.name; }).join(', ') + '.' : ''), 'Dar aula').then(function (y) {\n      if (!y) return;\n      ok.forEach(function (s) { st.entries.push(useEntry(s.id)); });\n      save(); route(); toast('Aula dada para ' + ok.length + ' ✓');\n    });\n  }\n  function entryInfo(en) {\n    var isP = en.type === 'pack';\n    sheet('\u003ch3>' + (isP ? '🎟 Aulas pagas' : '🎾 Aula dada') + '\u003c/h3>\u003cdiv class=\"s\" style=\"margin-bottom:10px\">' + L.fmtDate(en.date) + (isP ? ' · ' + en.qty + ' aula(s) · ' + L.fmt(en.amount) + (en.method ? ' · ' + esc(en.method) : '') : (en.settled ? ' · abateu ' + L.fmt(en.settled) + ' da dívida' : '')) + '\u003c/div>' +\n      '\u003cbutton class=\"btn red\" id=\"del\">' + (isP ? '🗑 Excluir esta compra' : '↩ Desfazer esta aula') + '\u003c/button>\u003cbutton class=\"btn sec\" id=\"cn\">Fechar\u003c/button>');\n    $('#cn').onclick = closeSheet;\n    $('#del').onclick = function () {\n      confirmBox(isP ? 'Excluir esta compra? As ' + en.qty + ' aulas pagas saem do saldo e o valor deixa de contar como recebido.' : 'Desfazer esta aula? A aula paga volta para o aluno' + (en.settled ? ' e a dívida volta a subir ' + L.fmt(en.settled) : '') + '.', isP ? 'Excluir' : 'Desfazer').then(function (y) {\n        if (!y) return;\n        st.entries = st.entries.filter(function (x) { return x.id !== en.id; });\n        save(); route(); toast(isP ? 'Compra excluída' : 'Aula desfeita');\n      });\n    };\n  }\n\n  // ---------- Backup por texto ----------\n  function textBackup() {\n    sheet('\u003ch3>📋 Backup por texto\u003c/h3>\u003cdiv class=\"s\" style=\"margin-bottom:8px\">Copie e guarde o texto (nota, WhatsApp, e-mail). Para restaurar, cole aqui e toque em Restaurar.\u003c/div>' +\n      '\u003ctextarea id=\"bt\" rows=\"8\" style=\"width:100%;font:inherit;font-size:.75rem;padding:12px;border-radius:14px;border:1.5px solid transparent;background:var(--card2);color:var(--ink);margin-bottom:8px\">\u003c/textarea>' +\n      '\u003cdiv class=\"row\">\u003cbutton class=\"btn sec\" id=\"bc\">Copiar\u003c/button>\u003cbutton class=\"btn\" id=\"br\">Restaurar\u003c/button>\u003c/div>\u003cbutton class=\"btn sec\" id=\"cn\">Fechar\u003c/button>');\n    $('#bt').value = JSON.stringify(st);\n    $('#cn').onclick = closeSheet;\n    $('#bc').onclick = function () {\n      var el = $('#bt');\n      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(function () { toast('Texto copiado'); }, fb); else fb();\n      function fb() { try { el.focus(); el.select(); document.execCommand('copy'); toast('Texto copiado'); } catch (e) { toast('Selecione o texto e copie'); } }\n    };\n    $('#br').onclick = function () {\n      var d; try { d = JSON.parse($('#bt').value); } catch (e) { d = null; }\n      if (!d || !d.students || !d.classes || !d.entries) return toast('Texto de backup inválido');\n      confirmBox('Substituir TODOS os dados atuais pelo backup (' + d.students.length + ' alunos)?', 'Restaurar').then(function (y) {\n        if (!y) return; if (!d.hiddenDays) d.hiddenDays = []; if (!d.price) d.price = 1000; st = d; save(); route(); toast('Backup restaurado ✓');\n      });\n    };\n  }\n\n  // ---------- Backup ----------\n  function exportData() {\n    var blob = new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' });\n    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);\n    a.download = 'minhas-aulas-backup-' + L.dateStr() + '.json'; document.body.appendChild(a); a.click(); a.remove();\n    toast('Backup gerado ✓');\n  }\n  function importFile(e) {\n    var f = e.target.files[0]; if (!f) return;\n    var r = new FileReader();\n    r.onload = function () {\n      try {\n        var d = JSON.parse(r.result);\n        if (!d.students || !d.classes || !d.entries) throw 0;\n        confirmBox('Substituir TODOS os dados atuais pelo backup (' + d.students.length + ' alunos)?', 'Restaurar').then(function (y) {\n          if (!y) return; if (!d.hiddenDays) d.hiddenDays = []; if (!d.price) d.price = 1000; st = d; save(); route(); toast('Backup restaurado ✓');\n        });\n      } catch (x) { toast('Arquivo de backup inválido'); }\n    };\n    r.readAsText(f);\n  }\n  function importPick() { var f = $('#file'); if (f) f.click(); }\n\n  // ---------- Eventos ----------\n  document.addEventListener('click', function (e) {\n    var l = e.target.closest('a[href^=\"#\"]');\n    if (l) {\n      e.preventDefault();\n      var p = l.getAttribute('href').slice(1) || '/';\n      if (l.closest('nav')) { stack = []; cur = p; route(); window.scrollTo(0, 0); } else nav(p);\n      return;\n    }\n    var b = e.target.closest('[data-act]'); if (!b) return;\n    var a = b.dataset.act, id = b.dataset.id;\n    if (a === 'back') return back();\n    if (a === 'newClass') return classForm(null, +b.dataset.day);\n    if (a === 'newClassAny') return classForm(null, -1);\n    if (a === 'editDays') return daysForm();\n    if (a === 'editClass') return classForm(cls(id));\n    if (a === 'newStudent') return studentForm(null);\n    if (a === 'editStudent') return studentForm(student(id));\n    if (a === 'addToClass') return addToClass(b.dataset.cid);\n    if (a === 'removeFromClass') {\n      var c = cls(b.dataset.cid), s = student(id);\n      return confirmBox('Remover ' + s.name + ' desta aula? Ela continua cadastrada e a dívida é mantida.', 'Remover').then(function (y) {\n        if (!y) return; c.studentIds = c.studentIds.filter(function (i) { return i !== id; }); save(); route(); toast('Removido da aula');\n      });\n    }\n    if (a === 'pay') return entryForm('payment', id);\n    if (a === 'debt') return entryForm('debt', id);\n    if (a === 'payAll') {\n      var amt = L.pending(st, id); if (amt \u003c= 0) return;\n      return confirmBox('Registrar pagamento total de ' + L.fmt(amt) + '?', 'Confirmar').then(function (y) {\n        if (!y) return;\n        st.entries.push({ id: uid(), studentId: id, type: 'payment', amount: amt, date: L.dateStr(), note: 'Pagamento total', method: '' });\n        save(); route(); toast('Quitado ✓');\n      });\n    }\n    if (a === 'editEntry') { var en = st.entries.filter(function (x) { return x.id === id; })[0]; if (en) return (en.type === 'pack' || en.type === 'use') ? entryInfo(en) : entryForm(en.type, en.studentId, en); }\n    if (a === 'packs') return packForm(id);\n    if (a === 'giveClass') return giveClass(id);\n    if (a === 'giveAll') return giveAll(b.dataset.cid);\n    if (a === 'textBackup') return textBackup();\n    if (a === 'export') return exportData();\n    if (a === 'import') return importPick();\n  });\n\n  window.addEventListener('error', function (e) { toast('Erro: ' + (e.message || 'desconhecido')); });\n  // ---------- PWA ----------\n  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });\n\n  route();\n  window.__app = { get state() { return st; }, route: route };\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",

(90deg,var(--p),var(--p2));border-radius:99px}.catline{margin:14px 0}.cathead{display:flex;justify-content:space-between;font-size:14px}\n.goal{padding:13px 0;border-bottom:1px solid var(--line)}.goal:last-child{border:0}.goalhead{display:flex;justify-content:space-between;gap:10px}.goal small{color:var(--muted)}\n.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px 3px}\nnav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}\nnav button{border:0;background:none;color:var(--muted);font-size:10px;padding:5px 2px}nav button span{display:block;font-size:21px}nav button.active{color:var(--p);font-weight:800}\n.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:92px;width:58px;height:58px;border-radius:19px;border:0;background:var(--p);color:#fff;font-size:30px;box-shadow:0 9px 24px #6d28d955;z-index:15}\n.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:620px;background:var(--card);border-radius:27px 27px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin-top:0}\n.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#21182b;color:white;padding:11px 16px;border-radius:99px;z-index:80;display:none;white-space:nowrap}\n.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.sectionhead h2{font-size:18px}.pill{font-size:12px;background:var(--bg);padding:7px 10px;border-radius:99px}\n.info-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px}.info-box{margin-top:10px;background:var(--card);padding:12px;border-radius:12px}@media(min-width:700px){body{padding-top:15px}.top{border-radius:30px}}\n.vc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}\n.vc button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:var(--bg);color:var(--text);font-weight:750;min-width:52px}\n.vc button:active{background:var(--p);color:#fff}\n.vc button.clr{color:var(--danger)}\n.hero .vc{margin:10px 0 0}\nbody.bico .clt-only{display:none}\n.donutCard{text-align:center}\n.donutWrap{position:relative;width:210px;height:210px;margin:6px auto 4px;cursor:pointer}\n.donutWrap svg{width:100%;height:100%;transform:rotate(-90deg)}\n.donutCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}\n.donutCenter b{font-size:26px;font-weight:850}\n.payRow{text-align:center}.payRow .pay{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 12px rgba(34,197,94,.35)}.payRow .pay:active{transform:scale(.96)}.payRow .undo{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted,#888);font:inherit;font-size:12px;padding:4px}\n.donutLegend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}\n.legItem{display:flex;align-items:center;gap:6px;background:var(--bg);padding:7px 11px;border-radius:99px;font-size:13px}\n.legDot{width:11px;height:11px;border-radius:50%;flex:none}\n.catHead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-weight:750}\n.catBar{height:6px;border-radius:9px;background:var(--bg);overflow:hidden;margin-bottom:8px}\n.catBar i{display:block;height:100%}\n.backBtn{border:0;background:var(--bg);color:var(--text);border-radius:12px;padding:9px 13px;font-weight:700}\n.donutLeft{font-size:20px;font-weight:800;margin-top:6px}\n.donutLeft.warn{color:#ef4444}.donutLeft.mid{color:#d97706}.donutLeft.ok{color:#16a34a}\n#home .homeTop{margin-top:-58px}\nbody.nothome .top{padding-bottom:26px}\nbody.nothome main{padding-top:14px}\n#expenses .summary{margin:0 0 12px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\u003cheader class=\"top\">\u003cdiv class=\"toprow\">\u003cdiv>\u003cp>Seu dinheiro é seu tempo.\u003c/p>\u003ch1>Meu Tempo Vale\u003c/h1>\u003c/div>\u003cdiv class=\"pig\">🐷\u003c/div>\u003c/div>\u003c/header>\n\n\u003cmain>\n\u003c!-- ONBOARDING (PRIMEIRA VEZ) INÍCIO -->\n\u003csection id=\"onboarding\" class=\"screen\">\n\u003cdiv class=\"card hero\" style=\"text-align:center\">\n\u003cdiv style=\"font-size:44px;margin-bottom:6px\">👋\u003c/div>\n\u003ch2>Vamos configurar seu perfil\u003c/h2>\n\u003cp class=\"muted\">Leva menos de 1 minuto. Isso é só pra calcular o valor da sua hora de trabalho.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003cdiv class=\"field\">\u003clabel>Renda mensal (R$)\u003c/label>\u003cinput id=\"obSalary\" type=\"number\" inputmode=\"decimal\" placeholder=\"Ex.: 1500\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Horas trabalhadas por semana\u003c/label>\u003cinput id=\"obWorkHours\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"0.5\" placeholder=\"Ex.: 40\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Horas trabalhadas por dia\u003c/label>\u003cinput id=\"obWorkDayHours\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"0.5\" placeholder=\"Ex.: 8\">\u003c/div>\n\u003cbutton class=\"btn wide\" onclick=\"finishOnboarding()\">Começar a usar\u003c/button>\n\u003cp class=\"muted\" style=\"margin:10px 0 0\">Depois você pode alterar esses dados em Ajustes (1 vez por dia).\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003c!-- ONBOARDING (PRIMEIRA VEZ) FIM -->\n\u003csection id=\"home\" class=\"screen active\">\n\u003cdiv class=\"card donutCard homeTop\">\n \u003cdiv class=\"label\" style=\"text-align:left;font-weight:700\">💳 Fatura do cartão\u003c/div>\n \u003cdiv class=\"donutWrap\" onclick=\"openFatura()\">\u003csvg viewBox=\"0 0 42 42\" id=\"donutSvg\">\u003c/svg>\n  \u003cdiv class=\"donutCenter\">\u003cspan class=\"label\">Gasto\u003c/span>\u003cb id=\"donutTotal\">R$ 0,00\u003c/b>\u003cspan class=\"label\" id=\"donutOf\">\u003c/span>\u003c/div>\u003c/div>\n \u003cdiv id=\"donutLeft\" class=\"donutLeft\">\u003c/div>\n \u003cdiv class=\"donutLegend\" id=\"donutLegend\" onclick=\"openFatura()\">\u003c/div>\n \u003cdiv class=\"payRow\" id=\"payRow\">\u003c/div>\n \u003cdiv class=\"label\" style=\"margin-top:8px\">Toque na bola para ver os gastos\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card hero clt-only\" id=\"simCard\">\u003ch2>⏱️ Quanto isso custa do seu tempo?\u003c/h2>\u003cp class=\"muted\">Veja o impacto antes de comprar.\u003c/p>\u003cdiv class=\"field\" id=\"simRecWrap\" style=\"display:none\">\u003clabel>Quanto você recebeu (R$)\u003c/label>\u003cinput id=\"simReceived\" type=\"number\" inputmode=\"decimal\" placeholder=\"Ex.: 800\">\u003cdiv class=\"vc\" data-for=\"simReceived\">\u003c/div>\u003c/div>\u003cdiv class=\"row\">\u003cinput id=\"simValue\" type=\"number\" inputmode=\"decimal\" placeholder=\"Valor em R$\">\u003cbutton class=\"btn\" onclick=\"simulate()\">Calcular\u003c/button>\u003c/div>\u003cdiv class=\"vc\" data-for=\"simValue\">\u003c/div>\u003cdiv class=\"result\" id=\"simResult\">\u003c/div>\u003c/div>\n\u003cdiv class=\"sectionhead\">\u003ch2>Últimos gastos\u003c/h2>\u003cspan class=\"pill\" id=\"expenseCount\">\u003c/span>\u003c/div>\u003cdiv class=\"card\" id=\"recentList\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"expenses\" class=\"screen\">\u003csection class=\"summary\">\n\u003cdiv class=\"label\">Disponível neste mês \u003cspan class=\"info-icon\" style=\"width:16px;height:16px;font-size:10px;margin-left:4px;vertical-align:middle\" onclick=\"showBalanceInfo()\">ⓘ\u003c/span>\u003c/div>\u003cdiv class=\"balance\" id=\"balance\">R$ 0,00\u003c/div>\u003cdiv id=\"balSplit\" style=\"font-size:11px;opacity:.7;margin-top:2px\">\u003c/div>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"mini\">\u003cspan class=\"label\">Valor da hora\u003c/span>\u003cb id=\"hourValue\">\u003c/b>\u003c/div>\n\u003cdiv class=\"mini\">\u003cspan class=\"label\">Tempo gasto \u003cspan class=\"info-icon\" style=\"width:16px;height:16px;font-size:10px;margin-left:4px;vertical-align:middle\" onclick=\"showSpentHoursInfo()\">ⓘ\u003c/span>\u003c/span>\u003cb id=\"spentTime\">\u003c/b>\u003c/div>\n\u003cdiv class=\"mini\">\u003cspan class=\"label\">Gastos hoje\u003c/span>\u003cb id=\"daySpent\">\u003c/b>\u003c/div>\n\u003cdiv class=\"mini\">\u003cspan class=\"label\">Gastos no mês\u003c/span>\u003cb id=\"monthSpent\">\u003c/b>\u003c/div>\n\u003cdiv class=\"mini\">\u003cspan class=\"label\">Últimos 7 dias\u003c/span>\u003cb id=\"weekSpent\">\u003c/b>\u003c/div>\n\u003c/div>\u003c/section>\n\u003cdiv class=\"sectionhead\">\u003ch2>Todos os gastos\u003c/h2>\u003cselect id=\"filterCategory\" style=\"width:auto\" onchange=\"renderAll()\">\u003coption value=\"\">Todas\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"card\" id=\"allList\">\u003c/div>\u003c/section>\n\n\u003csection id=\"reports\" class=\"screen\">\u003cdiv class=\"card\">\u003ch2>Resumo\u003c/h2>\u003cdiv id=\"reportSummary\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>📅 Histórico mensal\u003c/h2>\u003cp class=\"muted\">Escolha um mês para ver os gastos por categoria e a lista completa.\u003c/p>\u003cselect id=\"historyMonthSelect\" onchange=\"renderMonthHistory()\">\u003c/select>\n\u003ch2 id=\"categoryReportTitle\" style=\"margin:18px 0 8px;font-size:15px\">📊 Gastos por categoria\u003c/h2>\u003cdiv id=\"categoryReport\">\u003c/div>\n\u003cdiv id=\"monthHistoryDetail\" style=\"margin-top:14px\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"fatura\" class=\"screen\">\n \u003cdiv class=\"sectionhead\">\u003cbutton class=\"backBtn\" onclick=\"showScreen('home',document.querySelector('nav button'))\">← Voltar\u003c/button>\u003cspan class=\"pill\" id=\"faturaTotal\">\u003c/span>\u003c/div>\n \u003ch2 style=\"margin:14px 2px 0\">Gastos do mês\u003c/h2>\u003cdiv class=\"payRow\" id=\"payRow2\" style=\"margin-top:12px\">\u003c/div>\u003cdiv class=\"card\" id=\"faturaList\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"goals\" class=\"screen\">\n\u003cdiv class=\"card hero\">\u003ch2>🎯 Simule uma meta\u003c/h2>\u003cp class=\"muted\">Descubra quantas horas de trabalho um objetivo representa.\u003c/p>\u003cbutton class=\"btn wide\" onclick=\"openGoal()\">Criar nova meta\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Minhas metas\u003c/h2>\u003cdiv id=\"goalList\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"settings\" class=\"screen\">\n\u003cdiv class=\"card\">\u003ch2>💼 Como você recebe hoje?\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"modeCltBtn\" onclick=\"setMode('clt')\">CLT (salário fixo)\u003c/button>\u003cbutton class=\"btn secondary\" id=\"modeBicoBtn\" onclick=\"setMode('bico')\">Por aula / bico\u003c/button>\u003c/div>\u003cp class=\"muted\" id=\"modeHint\" style=\"margin:10px 0 0\">\u003c/p>\u003c/div>\n\u003cdiv class=\"card\" id=\"cardSettings\">\u003ch2>💳 Cartão e cofrinho\u003c/h2>\u003cdiv class=\"field\">\u003clabel>Limite do cartão (R$) — deixe vazio para não usar limite\u003c/label>\u003cinput id=\"cardLimitInput\" type=\"number\" inputmode=\"decimal\" placeholder=\"0,00\" oninput=\"setCardLimit(this.value)\">\u003cdiv class=\"vc\" data-for=\"cardLimitInput\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel>Saldo do cofrinho (R$) — dinheiro guardado fora da fatura\u003c/label>\u003cinput id=\"savedOutside\" type=\"number\" inputmode=\"decimal\" placeholder=\"0,00\" oninput=\"setSavedOutside(this.value)\">\u003cdiv class=\"vc\" data-for=\"savedOutside\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card clt-only\">\u003ch2>⚙️ Seus dados\u003c/h2>\u003cdiv class=\"field\">\u003clabel>Renda mensal (R$)\u003c/label>\u003cinput id=\"salary\" type=\"number\" inputmode=\"decimal\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Horas trabalhadas por semana\u003c/label>\u003cinput id=\"workHours\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"0.5\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Horas trabalhadas por dia\u003c/label>\u003cinput id=\"workDayHours\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"0.5\">\u003c/div>\u003cp class=\"muted\">O app usa a média de 4,33 semanas por mês para calcular o valor da sua hora.\u003c/p>\u003cbutton class=\"btn wide\" id=\"saveSettingsBtn\" onclick=\"saveSettings()\">Salvar dados\u003c/button>\u003cp class=\"muted\" id=\"settingsEditLabel\" style=\"margin:10px 0 0\">\u003c/p>\u003c/div>\n\u003c!-- PREMIUM: DATAS DE RECEBIMENTO INÍCIO -->\n\u003cdiv class=\"card clt-only\">\n\u003ch2>📅 Datas de recebimento\u003c/h2>\n\u003cp class=\"muted\">Se você recebe em datas fixas (ex.: dia 5 e dia 20), cadastre aqui. O \"Disponível neste mês\" na tela inicial passa a mostrar só o que você já recebeu até hoje — e sua renda mensal é calculada automaticamente pela soma dessas datas.\u003c/p>\n\u003cdiv class=\"row\">\u003cdiv class=\"field\" style=\"flex:1\">\u003clabel>Dia do mês\u003c/label>\u003cinput id=\"payDay\" type=\"number\" min=\"1\" max=\"31\" placeholder=\"Ex.: 5\">\u003c/div>\u003cdiv class=\"field\" style=\"flex:1\">\u003clabel>Valor (R$)\u003c/label>\u003cinput id=\"payAmount\" type=\"number\" inputmode=\"decimal\" placeholder=\"Ex.: 400\">\u003cdiv class=\"vc\" data-for=\"payAmount\">\u003c/div>\u003c/div>\u003c/div>\n\u003cbutton class=\"btn wide\" onclick=\"addPayDate()\">➕ Adicionar data de recebimento\u003c/button>\n\u003cdiv id=\"payDateList\" style=\"margin-top:14px\">\u003c/div>\n\u003c/div>\n\u003c!-- PREMIUM: DATAS DE RECEBIMENTO FIM -->\n\u003cdiv class=\"card\">\u003ch2>Aparência e dados\u003c/h2>\u003cbutton class=\"btn secondary wide\" onclick=\"toggleDark()\">🌙 Alternar modo claro/escuro\u003c/button>\u003cbr>\u003cbr>\u003cbutton class=\"btn secondary wide\" onclick=\"exportData()\">⬇️ Exportar backup\u003c/button>\u003cbr>\u003cbr>\u003cbutton class=\"btn secondary wide\" onclick=\"openBackupText()\">📋 Backup por texto (copiar/colar)\u003c/button>\u003cbr>\u003cbr>\u003clabel class=\"btn secondary wide\" style=\"display:block;text-align:center;cursor:pointer\">⬆️ Importar backup\u003cinput type=\"file\" accept=\".json,application/json\" onchange=\"importData(event)\" hidden>\u003c/label>\u003cbr>\u003cbutton class=\"btn danger wide\" onclick=\"clearData()\">Apagar todos os dados\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"extras\" class=\"screen\">\n\u003cdiv class=\"card hero\">\u003ch2>💰 Ganhos Extras\u003c/h2>\u003cp class=\"muted\">Adicione outras fontes de renda além do salário principal.\u003c/p>\n\u003cdiv class=\"field\">\u003clabel>Descrição do ganho\u003c/label>\u003cinput id=\"extraDesc\" placeholder=\"Ex.: Freelancer\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Valor (R$)\u003c/label>\u003cinput id=\"extraAmount\" type=\"number\" inputmode=\"decimal\" placeholder=\"0,00\">\u003cdiv class=\"vc\" data-for=\"extraAmount\">\u003c/div>\u003c/div>\n\u003cbutton class=\"btn wide\" onclick=\"addExtraIncome()\">➕ Adicionar ganho\u003c/button>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Ganhos cadastrados\u003c/h2>\u003cdiv id=\"extraList\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"cathead\">\u003cspan class=\"label\">Total de ganhos extras\u003c/span>\u003cb id=\"extraTotalValue\">\u003c/b>\u003c/div>\u003cdiv class=\"cathead\" style=\"margin-top:8px\">\u003cspan class=\"label\">Renda total do mês\u003c/span>\u003cb id=\"rendaTotalValue\">\u003c/b>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\n\u003cbutton class=\"fab\" id=\"fab\" onclick=\"openExpense()\">+\u003c/button>\n\u003cnav>\n\u003cbutton class=\"active\" data-screen=\"home\" onclick=\"showScreen('home',this)\">\u003cspan>🏠\u003c/span>Início\u003c/button>\n\u003cbutton data-screen=\"expenses\" onclick=\"showScreen('expenses',this)\">\u003cspan>💳\u003c/span>Gastos\u003c/button>\n\u003cbutton data-screen=\"reports\" onclick=\"showScreen('reports',this)\">\u003cspan>📊\u003c/span>Relatórios\u003c/button>\n\u003cbutton data-screen=\"goals\" onclick=\"showScreen('goals',this)\">\u003cspan>🎯\u003c/span>Metas\u003c/button>\n\u003cbutton data-screen=\"settings\" onclick=\"showScreen('settings',this)\">\u003cspan>⚙️\u003c/span>Ajustes\u003c/button>\n\u003cbutton data-screen=\"extras\" onclick=\"showScreen('extras',this)\">\u003cspan>💰\u003c/span>Extras\u003c/button>\n\u003c/nav>\n\n\u003cdiv class=\"modal\" id=\"expenseModal\">\u003cdiv class=\"sheet\">\u003ch2 id=\"expenseTitle\">Adicionar gasto\u003c/h2>\u003cinput type=\"hidden\" id=\"editId\">\n\u003cdiv class=\"field\">\u003clabel>O que você comprou?\u003c/label>\u003cinput id=\"expenseName\" placeholder=\"Ex.: Hambúrguer\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Valor (R$)\u003c/label>\u003cinput id=\"expenseAmount\" type=\"number\" inputmode=\"decimal\" placeholder=\"0,00\">\u003cdiv class=\"vc\" data-for=\"expenseAmount\">\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Categoria\u003c/label>\u003cselect id=\"expenseCategory\">\u003c/select>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Como você pagou?\u003c/label>\u003cselect id=\"expensePay\">\u003coption value=\"card\">💳 No cartão (entra na fatura)\u003c/option>\u003coption value=\"piggy\">🐷 Com o cofrinho (desconta do saldo guardado)\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>Data do gasto\u003c/label>\u003cinput id=\"expenseDate\" type=\"date\">\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn secondary\" onclick=\"closeModal('expenseModal')\">Cancelar\u003c/button>\u003cbutton class=\"btn\" onclick=\"saveExpense()\">Salvar\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"modal\" id=\"goalModal\">\u003cdiv class=\"sheet\">\u003ch2>Nova meta\u003c/h2>\n\u003cdiv class=\"field\">\u003clabel>O que você quer comprar?\u003c/label>\u003cinput id=\"goalName\" placeholder=\"Ex.: Celular\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Valor do objetivo (R$)\u003c/label>\u003cinput id=\"goalValue\" type=\"number\" inputmode=\"decimal\">\u003cdiv class=\"vc\" data-for=\"goalValue\">\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>Quanto já guardou? (R$)\u003c/label>\u003cinput id=\"goalSaved\" type=\"number\" inputmode=\"decimal\" value=\"0\">\u003cdiv class=\"vc\" data-for=\"goalSaved\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel>Foto do objetivo (opcional)\u003c/label>\u003cinput id=\"goalImage\" type=\"file\" accept=\"image/*\">\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn secondary\" onclick=\"closeModal('goalModal')\">Cancelar\u003c/button>\u003cbutton class=\"btn\" onclick=\"saveGoal()\">Criar meta\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"modal\" id=\"backupModal\">\u003cdiv class=\"sheet\">\u003ch2>📋 Backup por texto\u003c/h2>\u003cp class=\"muted\">Copie este texto e guarde (nota, WhatsApp, e-mail). Para restaurar, cole o texto aqui e toque em Restaurar.\u003c/p>\u003ctextarea id=\"backupText\" rows=\"8\" style=\"width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-size:12px\">\u003c/textarea>\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"btn secondary\" onclick=\"copyBackupText()\">Copiar\u003c/button>\u003cbutton class=\"btn\" onclick=\"restoreBackupText()\">Restaurar\u003c/button>\u003c/div>\u003cbutton class=\"btn secondary wide\" style=\"margin-top:8px\" onclick=\"closeModal('backupModal')\">Fechar\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal\" id=\"confirmModal\">\u003cdiv class=\"sheet\">\u003ch2>Confirmar\u003c/h2>\u003cp id=\"confirmMessage\" class=\"muted\">\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"btn secondary\" onclick=\"confirmNo()\">Cancelar\u003c/button>\u003cbutton class=\"btn danger\" onclick=\"confirmYes()\">Confirmar\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal\" id=\"promptModal\">\u003cdiv class=\"sheet\">\u003ch2 id=\"promptTitle\">Informe o valor\u003c/h2>\u003cp id=\"promptMessage\" class=\"muted\">\u003c/p>\u003cdiv class=\"field\">\u003cinput id=\"promptInput\" type=\"number\" inputmode=\"decimal\">\u003cdiv class=\"vc\" data-for=\"promptInput\">\u003c/div>\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"btn secondary\" onclick=\"promptCancel()\">Cancelar\u003c/button>\u003cbutton class=\"btn\" onclick=\"promptOk()\">OK\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal\" id=\"alertModal\">\u003cdiv class=\"sheet\">\u003ch2 id=\"alertTitle\">Aviso\u003c/h2>\u003cp id=\"alertMessage\" class=\"muted\" style=\"white-space:pre-line\">\u003c/p>\u003cbutton class=\"btn wide\" onclick=\"closeModal('alertModal')\">OK\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\nfunction todayKey(){return todayLocalStr()}\nfunction checkOnboarding(){\n if(!state.onboardingDone){showScreen(\"onboarding\",null)}\n}\n\nconst cats={\n fastfood:{name:\"Fast-food\",icon:\"🍔\"},transport:{name:\"Transporte\",icon:\"🚕\"},\n leisure:{name:\"Lazer\",icon:\"🎮\"},market:{name:\"Mercado\",icon:\"🛒\"},\n clothes:{name:\"Roupas\",icon:\"👕\"},subscriptions:{name:\"Assinaturas\",icon:\"📱\"},\n home:{name:\"Casa\",icon:\"🏠\"},health:{name:\"Saúde\",icon:\"💊\"},other:{name:\"Outros\",icon:\"📦\"}\n};\nlet state=load();\nif(!Array.isArray(state.extraIncomes))state.extraIncomes=[];\nstate.extraIncomes.forEach(x=>{\n if(!x.date){\n  const ts=Number(x.id);\n  x.date=(ts&&!isNaN(ts))?toDateInputStr(new Date(ts)):todayLocalStr();\n }\n});\nif(!Array.isArray(state.payDates))state.payDates=[];\nstate.cardLimit=Number(state.cardLimit||0);state.savedOutside=Number(state.savedOutside||0);\nif(typeof state.onboardingDone!==\"boolean\"){\n state.onboardingDone=!!((state.expenses&&state.expenses.length)||(state.goals&&state.goals.length)||(state.salary&&state.salary!==800));\n}\nfunction load(){\n try{\n  const x=JSON.parse(localStorage.getItem(\"mtv_state\"));\n  return x||{salary:800,workHours:20,workDayHours:4,expenses:[],goals:[],dark:false};\n }catch(e){return {salary:800,workHours:20,workDayHours:4,expenses:[],goals:[],dark:false}}\n}\nfunction persist(){localStorage.setItem(\"mtv_state\",JSON.stringify(state))}\nfunction modoBico(){return state.mode===\"bico\"}\nfunction money(v){return Number(v||0).toLocaleString(\"pt-BR\",{style:\"currency\",currency:\"BRL\"})}\nfunction hourValue(){const monthlyHours=state.workHours*4.33;return monthlyHours>0?rendaTotal()/monthlyHours:0}\nfunction extraTotal(month,year){\n const now=new Date();\n const m=month===undefined?now.getMonth():month,y=year===undefined?now.getFullYear():year;\n return (state.extraIncomes||[]).filter(x=>{\n  const d=parseLocalDate(x.date||todayLocalStr());\n  return d.getMonth()===m&&d.getFullYear()===y;\n }).reduce((a,b)=>a+Number(b.amount||0),0);\n}\nfunction extraTotalAllTime(){return (state.extraIncomes||[]).reduce((a,b)=>a+Number(b.amount||0),0)}\nfunction rendaTotal(month,year){return (modoBico()?0:Number(state.salary||0))+extraTotal(month,year)}\nfunction payDatesTotal(){return (state.payDates||[]).reduce((a,b)=>a+Number(b.valor||0),0)}\nfunction recebidoAteHoje(){\n if(!state.payDates||!state.payDates.length)return Number(state.salary||0);\n const hoje=new Date().getDate();\n return state.payDates.reduce((a,b)=>a+(Number(b.dia)\u003c=hoje?Number(b.valor||0):0),0);\n}\nfunction syncSalaryFromPayDates(){\n if(state.payDates&&state.payDates.length)state.salary=payDatesTotal();\n}\nfunction timeText(hours){\n if(!isFinite(hours)||hours\u003c0)return \"0h 00min\";\n const m=Math.round(hours*60),h=Math.floor(m/60),min=m%60;\n return `${h}h ${String(min).padStart(2,\"0\")}min`\n}\nfunction dayTimeText(hours){\n if(!isFinite(hours)||hours\u003c0)return timeText(0);\n const diaHoras=state.workDayHours||1;\n const dias=Math.floor(hours/diaHoras);\n const rest=hours-(dias*diaHoras);\n const m=Math.round(rest*60),h=Math.floor(m/60),min=m%60;\n let restText=\"\";\n if(h>0&&min>0)restText=`${h}h ${String(min).padStart(2,\"0\")}min`;\n else if(h>0)restText=`${h}h`;\n else if(min>0)restText=`${min}min`;\n if(dias>0)return restText?`${dias} dia${dias>1?\"s\":\"\"} e ${restText}`:`${dias} dia${dias>1?\"s\":\"\"}`;\n return restText||\"0min\";\n}\nfunction showHoursAlert(hours){showAlert(`⏱️ ${timeText(hours)} de trabalho`)}\nfunction esc(s){return String(s).replace(/[&\u003c>\"']/g,m=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#039;\"}[m]))}\nfunction todayLocalStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,\"0\")}-${String(d.getDate()).padStart(2,\"0\")}`}\nfunction toDateInputStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,\"0\")}-${String(d.getDate()).padStart(2,\"0\")}`}\nfunction parseLocalDate(str){\n if(!str)return new Date(NaN);\n const datePart=String(str).split(\"T\")[0];\n const p=datePart.split(\"-\").map(Number);\n if(p.length===3&&!p.some(isNaN))return new Date(p[0],p[1]-1,p[2]);\n return new Date(str);\n}\nfunction toast(t){const e=document.getElementById(\"toast\");e.textContent=t;e.style.display=\"block\";setTimeout(()=>e.style.display=\"none\",2200)}\nfunction totals(){\n const now=new Date(),month=now.getMonth(),year=now.getFullYear(),day=now.getDate();\n const monthExpenses=state.expenses.filter(x=>{const d=parseLocalDate(x.date);return d.getMonth()===month&&d.getFullYear()===year});\n const monthSpent=monthExpenses.reduce((a,b)=>a+Number(b.amount),0);\n const weekSpent=state.expenses.filter(x=>(now-parseLocalDate(x.date))\u003c=7*86400000).reduce((a,b)=>a+Number(b.amount),0);\n const daySpent=state.expenses.filter(x=>{const d=parseLocalDate(x.date);return d.getDate()===day&&d.getMonth()===month&&d.getFullYear()===year}).reduce((a,b)=>a+Number(b.amount),0);\n return {monthSpent,weekSpent,daySpent}\n}\nfunction update(){\n const t=totals(),hv=hourValue();\n document.getElementById(\"hourValue\").textContent=money(hv);\n document.getElementById(\"spentTime\").textContent=dayTimeText(hv?t.monthSpent/hv:0);\n document.getElementById(\"monthSpent\").textContent=money(t.monthSpent);\n document.getElementById(\"daySpent\").textContent=money(t.daySpent);\n document.getElementById(\"weekSpent\").textContent=money(t.weekSpent);\n document.getElementById(\"salary\").value=state.salary;\n document.getElementById(\"workHours\").value=state.workHours;document.getElementById(\"workDayHours\").value=state.workDayHours||4;\n document.body.classList.toggle(\"dark\",!!state.dark);\n syncSalaryFromPayDates();renderRecent();renderAll();renderReports();renderGoals();renderExtras();updateSettingsEditLabel();renderPayDates();applyMode();renderDonut();renderSaved();if(document.getElementById(\"fatura\").classList.contains(\"active\"))renderFatura()\n}\nfunction expenseHTML(x){\n const c=cats[x.category]||cats.other,h=hourValue()?x.amount/hourValue():0;\n return `\u003cdiv class=\"expense\">\u003cdiv class=\"ico\">${c.icon}\u003c/div>\u003cdiv class=\"grow\">\u003cb>${esc(x.name)}\u003c/b>\u003cspan class=\"muted\">${c.name} • ${parseLocalDate(x.date).toLocaleDateString(\"pt-BR\")}${x.piggy?\" • 🐷 cofrinho\":\"\"}\u003c/span>\u003c/div>\u003cdiv class=\"right\">\u003cb>-${money(x.amount)}\u003c/b>${modoBico()?\"\":`\u003cspan class=\"muted\">${dayTimeText(h)} \u003cspan class=\"info-icon\" style=\"width:14px;height:14px;font-size:9px\" onclick=\"showHoursAlert(${h})\">ⓘ\u003c/span>\u003c/span>`}\u003cdiv class=\"actions\">\u003cbutton onclick=\"editExpense('${x.id}')\">✏️\u003c/button>\u003cbutton onclick=\"deleteExpense('${x.id}')\">🗑️\u003c/button>\u003c/div>\u003c/div>\u003c/div>`\n}\nfunction renderRecent(){\n const arr=[...state.expenses].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);\n document.getElementById(\"expenseCount\").textContent=`${state.expenses.length} registros`;\n document.getElementById(\"recentList\").innerHTML=arr.length?arr.map(expenseHTML).join(\"\"):`\u003cdiv class=\"empty\">🐷 Nenhum gasto registrado ainda.\u003c/div>`\n}\nfunction renderAll(){\n const f=document.getElementById(\"filterCategory\").value;\n const arr=[...state.expenses].filter(x=>!f||x.category===f).sort((a,b)=>parseLocalDate(b.date)-parseLocalDate(a.date));\n document.getElementById(\"allList\").innerHTML=arr.length?arr.map(expenseHTML).join(\"\"):`\u003cdiv class=\"empty\">Nenhum gasto nesta categoria.\u003c/div>`\n}\nfunction renderReports(){\n const t=totals();\n document.getElementById(\"reportSummary\").innerHTML=`\u003cp>Hoje: \u003cb>${money(t.daySpent)}\u003c/b>\u003c/p>\u003cp>Este mês: \u003cb>${money(t.monthSpent)}\u003c/b>\u003c/p>\u003cp>Últimos 7 dias: \u003cb>${money(t.weekSpent)}\u003c/b>\u003c/p>${modoBico()?\"\":`\u003cp>Tempo de trabalho consumido no mês: \u003cb>${dayTimeText(hourValue()?t.monthSpent/hourValue():0)}\u003c/b> \u003cspan class=\"info-icon\" onclick=\"showHoursAlert(${hourValue()?t.monthSpent/hourValue():0})\">ⓘ\u003c/span>\u003c/p>`}`\n populateHistoryMonths();\n}\nconst NOMES_MESES=[\"Janeiro\",\"Fevereiro\",\"Março\",\"Abril\",\"Maio\",\"Junho\",\"Julho\",\"Agosto\",\"Setembro\",\"Outubro\",\"Novembro\",\"Dezembro\"];\nfunction populateHistoryMonths(){\n const sel=document.getElementById(\"historyMonthSelect\");\n if(!sel)return;\n const chaves=new Set();\n const now=new Date();\n chaves.add(`${now.getFullYear()}-${now.getMonth()}`);\n (state.expenses||[]).forEach(x=>{const d=parseLocalDate(x.date);if(!isNaN(d))chaves.add(`
