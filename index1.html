an>\u003c/div>\u003cdiv class=\"right\">\u003cb style=\"color:var(--good)\">+${money(x.amount)}\u003c/b>\u003cdiv class=\"actions\">\u003cbutton onclick=\"deleteExtraIncome('${x.id}')\">🗑️\u003c/button>\u003c/div>\u003c/div>\u003c/div>`).join(\"\"):`\u003cdiv class=\"empty\">Nenhum ganho extra registrado este mês.\u003c/div>`;\n document.getElementById(\"extraTotalValue\").textContent=money(extraTotal());\n document.getElementById(\"rendaTotalValue\").textContent=money(rendaTotal());\n}\nfunction addPayDate(){\n const dia=Number(document.getElementById(\"payDay\").value),valor=Number(document.getElementById(\"payAmount\").value);\n if(!(dia>=1&&dia\u003c=31)||!(valor>0)){toast(\"Informe um dia (1-31) e um valor válido\");return}\n state.payDates.push({id:String(Date.now()),dia,valor});\n syncSalaryFromPayDates();\n persist();\n document.getElementById(\"payDay\").value=\"\";\n document.getElementById(\"payAmount\").value=\"\";\n update();\n toast(\"Data de recebimento adicionada\");\n}\nasync function deletePayDate(id){\n if(await showConfirm(\"Excluir esta data de recebimento?\")){\n  state.payDates=state.payDates.filter(x=>String(x.id)!==String(id));\n  if(state.payDates.length)syncSalaryFromPayDates();\n  persist();update();\n }\n}\nfunction renderPayDates(){\n const el=document.getElementById(\"payDateList\");\n if(!el)return;\n const salaryInput=document.getElementById(\"salary\");\n const arr=(state.payDates||[]).slice().sort((a,b)=>a.dia-b.dia);\n el.innerHTML=arr.length?arr.map(x=>`\u003cdiv class=\"expense\">\u003cdiv class=\"ico\">📅\u003c/div>\u003cdiv class=\"grow\">\u003cb>Dia ${x.dia}\u003c/b>\u003c/div>\u003cdiv class=\"right\">\u003cb style=\"color:var(--good)\">+${money(x.valor)}\u003c/b>\u003cdiv class=\"actions\">\u003cbutton onclick=\"deletePayDate('${x.id}')\">🗑️\u003c/button>\u003c/div>\u003c/div>\u003c/div>`).join(\"\"):`\u003cdiv class=\"empty\">Nenhuma data cadastrada. Sua renda mensal usa o valor informado acima.\u003c/div>`;\n if(salaryInput){\n  if(arr.length){salaryInput.readOnly=true;salaryInput.title=\"Calculado automaticamente pelas datas de recebimento\"}\n  else{salaryInput.readOnly=false;salaryInput.title=\"\"}\n }\n}\nfunction showBalanceInfo(){\n {const v=livre();showAlert((v.lim>0?`Liberado no cartão: ${money(v.card)} (limite ${money(v.lim)} menos a fatura aberta)`:`Saldo do mês: ${money(v.card)}`)+`\\nMais o cofrinho: ${money(v.piggy)} (guardado fora da fatura).\\nTotal disponível: ${money(v.total)}.`);return}\n if(modoBico()){showAlert(`Este valor é o que você ganhou neste mês (Extras) menos os gastos do mês: ${money(extraTotal())} - ${money(totals().monthSpent)}.`);return}\n if(state.payDates&&state.payDates.length){\n  showAlert(`Você já recebeu ${money(recebidoAteHoje()+extraTotal())} este mês (com base nas suas datas de recebimento). Sua renda mensal total é ${money(rendaTotal())}.`);\n }else{\n  showAlert(`Este valor é sua renda mensal total (${money(rendaTotal())}) menos os gastos do mês. Cadastre datas de recebimento em Ajustes para ver só o que já caiu na conta.`);\n }\n}\n\nfunction finishOnboarding(){\n const s=Number(document.getElementById(\"obSalary\").value),h=Number(document.getElementById(\"obWorkHours\").value),d=Number(document.getElementById(\"obWorkDayHours\").value);\n if(!(s>0&&h>0&&d>0)){toast(\"Preencha todos os campos corretamente\");return}\n state.salary=s;state.workHours=h;state.workDayHours=d;state.onboardingDone=true;\n persist();update();\n showScreen(\"home\",document.querySelector('[data-screen=home]'));\n toast(\"Perfil configurado! 🎉\");\n}\nfunction canEditSettingsToday(){\n let last=null;try{last=localStorage.getItem(\"porquinho_lastsettingsedit\")}catch(e){}\n return last!==todayKey();\n}\nfunction markSettingsEditedToday(){try{localStorage.setItem(\"porquinho_lastsettingsedit\",todayKey())}catch(e){}}\nfunction updateSettingsEditLabel(){\n const el=document.getElementById(\"settingsEditLabel\"),btn=document.getElementById(\"saveSettingsBtn\");\n if(!el||!btn)return;\n if(canEditSettingsToday()){el.textContent=\"Você pode alterar seus dados 1 vez por dia.\";btn.disabled=false}\n else{el.textContent=\"Você já alterou seus dados hoje. Tente novamente amanhã.\";btn.disabled=true}\n}\nfunction saveSettings(){\n if(!canEditSettingsToday()){toast(\"Você já alterou seus dados hoje. Tente novamente amanhã.\");return}\n const s=Number(document.getElementById(\"salary\").value),h=Number(document.getElementById(\"workHours\").value),d=Number(document.getElementById(\"workDayHours\").value);if(!(s>0&&h>0&&d>0)){toast(\"Informe valores válidos\");return}state.salary=s;state.workHours=h;state.workDayHours=d;markSettingsEditedToday();persist();update();updateSettingsEditLabel();toast(\"Dados atualizados\")}\nfunction toggleDark(){state.dark=!state.dark;persist();update()}\nasync function exportData(){\n const text=JSON.stringify(state,null,2),name=\"meu-tempo-vale-backup-\"+todayLocalStr()+\".json\";\n // 1) celular: abre o menu de compartilhar (salvar em Arquivos, WhatsApp, Drive...)\n try{\n  const file=new File([text],name,{type:\"application/json\"});\n  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:\"Backup Meu Tempo Vale\"});toast(\"Backup compartilhado\");return}\n }catch(e){if(e&&e.name===\"AbortError\")return}\n // 2) download comum (sem apagar o arquivo na hora, como antes)\n try{\n  const url=URL.createObjectURL(new Blob([text],{type:\"application/json\"})),a=document.createElement(\"a\");\n  a.href=url;a.download=name;a.style.display=\"none\";document.body.appendChild(a);a.click();\n  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},5000);\n  toast(\"Backup gerado. Se não aparecer nos downloads, use 'Backup por texto'.\");\n }catch(e){openBackupText()}\n}\nfunction openBackupText(){document.getElementById(\"backupText\").value=JSON.stringify(state);openModal(\"backupModal\")}\nasync function copyBackupText(){\n const el=document.getElementById(\"backupText\");\n try{await navigator.clipboard.writeText(el.value);toast(\"Texto copiado\");return}catch(e){}\n try{el.focus();el.select();document.execCommand(\"copy\");toast(\"Texto copiado\")}catch(e){showAlert(\"Não foi possível copiar. Segure no texto, selecione tudo e copie.\")}\n}\nasync function restoreBackupText(){\n let x;try{x=JSON.parse(document.getElementById(\"backupText\").value)}catch(e){x=null}\n if(!x||!Array.isArray(x.expenses)||!Array.isArray(x.goals)){showAlert(\"Texto de backup inválido. Cole o texto completo que você copiou.\");return}\n if(!(await showConfirm(\"Substituir TODOS os dados atuais por este backup?\")))return;\n state=x;if(!Array.isArray(state.extraIncomes))state.extraIncomes=[];if(!Array.isArray(state.payDates))state.payDates=[];\n persist();update();closeModal(\"backupModal\");toast(\"Backup restaurado\")\n}\nfunction importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.expenses)||!Array.isArray(x.goals))throw 0;state=x;if(!Array.isArray(state.extraIncomes))state.extraIncomes=[];if(!Array.isArray(state.payDates))state.payDates=[];persist();update();toast(\"Backup importado\")}catch(e){showAlert(\"Arquivo de backup inválido.\")}};r.readAsText(f);ev.target.value=\"\"}\nasync function clearData(){if(await showConfirm(\"Isso apagará gastos, metas e configurações. Continuar?\")){localStorage.removeItem(\"mtv_state\");state={salary:800,workHours:20,workDayHours:4,expenses:[],goals:[],dark:false};state.extraIncomes=[];state.cardLimit=0;state.savedOutside=0;state.lastPaid=[];persist();update();toast(\"Dados apagados\")}}\nfunction openModal(id){document.getElementById(id).classList.add(\"open\")}\nfunction closeModal(id){document.getElementById(id).classList.remove(\"open\")}\nlet _confirmResolve=null;\nfunction showConfirm(msg){document.getElementById(\"confirmMessage\").textContent=msg;openModal(\"confirmModal\");return new Promise(resolve=>{_confirmResolve=resolve})}\nfunction confirmYes(){closeModal(\"confirmModal\");if(_confirmResolve)_confirmResolve(true);_confirmResolve=null}\nfunction confirmNo(){closeModal(\"confirmModal\");if(_confirmResolve)_confirmResolve(false);_confirmResolve=null}\nlet _promptResolve=null;\nfunction showPrompt(msg,defVal){document.getElementById(\"promptMessage\").textContent=msg;document.getElementById(\"promptInput\").value=defVal||\"\";openModal(\"promptModal\");return new Promise(resolve=>{_promptResolve=resolve})}\nfunction promptOk(){const v=document.getElementById(\"promptInput\").value;closeModal(\"promptModal\");if(_promptResolve)_promptResolve(v);_promptResolve=null}\nfunction promptCancel(){closeModal(\"promptModal\");if(_promptResolve)_promptResolve(null);_promptResolve=null}\nfunction showAlert(msg){document.getElementById(\"alertMessage\").textContent=msg;openModal(\"alertModal\")}\ndocument.querySelectorAll(\".modal\").forEach(m=>m.addEventListener(\"click\",e=>{if(e.target===m)m.classList.remove(\"open\")}));\nconst catOptions=Object.entries(cats).map(([k,c])=>`\u003coption value=\"${k}\">${c.icon} ${c.name}\u003c/option>`).join(\"\");\ndocument.getElementById(\"expenseCategory\").innerHTML=catOptions;\ndocument.getElementById(\"filterCategory\").innerHTML='\u003coption value=\"\">Todas\u003c/option>'+catOptions;\n\nfunction celebrateGoal(){\n const emojis=[\"🎉\",\"🎊\",\"✨\",\"🏆\",\"🥳\"];\n for(let i=0;i\u003c35;i++){\n   const e=document.createElement(\"div\");\n   e.textContent=emojis[Math.floor(Math.random()*emojis.length)];\n   e.style.position=\"fixed\";\n   e.style.left=Math.random()*100+\"vw\";\n   e.style.top=\"-30px\";\n   e.style.fontSize=(20+Math.random()*20)+\"px\";\n   e.style.zIndex=\"9999\";\n   e.style.transition=\"transform 3s linear, top 3s linear\";\n   document.body.appendChild(e);\n   requestAnimationFrame(()=>{\n      e.style.top=\"110vh\";\n      e.style.transform=`rotate(${Math.random()*720}deg)`;\n   });\n   setTimeout(()=>e.remove(),3200);\n }\n}\n\n// Botões de valor rápido: cada toque soma ao campo (10 + 10 = 20, 10 + 5 = 15)\ndocument.querySelectorAll(\".vc[data-for]\").forEach(box=>{\n box.innerHTML=[5,10,15,20,50,100].map(v=>`\u003cbutton type=\"button\" data-v=\"${v}\">+${v}\u003c/button>`).join(\"\")+`\u003cbutton type=\"button\" class=\"clr\" data-clr=\"1\">Limpar\u003c/button>`;\n box.addEventListener(\"click\",e=>{\n  const b=e.target.closest(\"button\");if(!b)return;\n  const i=document.getElementById(box.dataset.for);if(!i)return;\n  if(b.dataset.clr)i.value=\"\";\n  else i.value=Math.round(((Number(i.value)||0)+Number(b.dataset.v))*100)/100;\n  i.dispatchEvent(new Event(\"input\",{bubbles:true}));\n });\n});\nconst catColors={fastfood:\"#22c55e\",transport:\"#3b82f6\",leisure:\"#a855f7\",market:\"#f59e0b\",clothes:\"#ef4444\",subscriptions:\"#06b6d4\",home:\"#ec4899\",health:\"#14b8a6\",other:\"#94a3b8\"};\nfunction monthByCat(){\n const n=new Date(),m=n.getMonth(),y=n.getFullYear(),map={};let total=0;\n state.expenses.forEach(x=>{const d=parseLocalDate(x.date);if(d.getMonth()!==m||d.getFullYear()!==y||x.paid||x.piggy)return;\n  const k=cats[x.category]?x.category:\"other\";map[k]=(map[k]||0)+Number(x.amount);total+=Number(x.amount)});\n const list=Object.keys(map).map(k=>({k,v:map[k]})).sort((a,b)=>b.v-a.v);\n return{list,total}\n}\nfunction renderDonut(){\n const svg=document.getElementById(\"donutSvg\");if(!svg)return;\n const {list,total}=monthByCat();\n const lim=Number(state.cardLimit||0);const base=lim>0?Math.max(lim,total):total;\n let h='\u003ccircle cx=\"21\" cy=\"21\" r=\"15.9155\" fill=\"none\" stroke=\"var(--bg)\" stroke-width=\"5.5\"/>';\n if(total>0){let off=0;list.forEach(c=>{const pct=c.v/base*100;const d=Math.max(pct-0.6,0.1);\n  h+=`\u003ccircle cx=\"21\" cy=\"21\" r=\"15.9155\" fill=\"none\" stroke=\"${catColors[c.k]}\" stroke-width=\"5.5\" stroke-dasharray=\"${d} ${100-d}\" stroke-dashoffset=\"${-off}\"/>`;off+=pct})}\n svg.innerHTML=h;\n document.getElementById(\"donutTotal\").textContent=money(total);\n document.getElementById(\"donutOf\").textContent=lim>0?\"de \"+money(lim):\"\";\n const L=document.getElementById(\"donutLeft\");\n if(lim>0){const left=lim-total;\n  if(left\u003c0){L.textContent=\"Passou \"+money(-left)+\" do limite\";L.className=\"donutLeft warn\"}\n  else{L.textContent=\"Falta \"+money(left);L.className=\"donutLeft \"+(left\u003c=100?\"warn\":left\u003c=200?\"mid\":\"ok\")}}\n else{L.textContent=\"Defina o limite em Ajustes\";L.className=\"donutLeft\"}\n renderPay(total);document.getElementById(\"donutLegend\").innerHTML=list.length?list.map(c=>`\u003cspan class=\"legItem\">\u003cspan class=\"legDot\" style=\"background:${catColors[c.k]}\">\u003c/span>${cats[c.k].icon} ${money(c.v)}\u003c/span>`).join(\"\"):'\u003cspan class=\"label\">Nenhum gasto neste mês ainda.\u003c/span>'\n}\nasync function editLimit(){\n const v=await showPrompt(\"Qual o limite do cartão? (ex.: 400) Deixe em branco para remover o limite.\",String(state.cardLimit||\"\"));\n if(v===null||v===undefined)return;\n if(String(v).trim()===\"\"){state.cardLimit=0;persist();update();toast(\"Limite removido\");return}\n const n=parseFloat(String(v).replace(\",\",\".\"));\n if(isNaN(n)||n\u003c0){showAlert(\"Digite um valor válido.\");return}\n state.cardLimit=n;persist();update();toast(\"Limite atualizado\")\n}\nfunction renderPay(total){\n const has=total>0,und=(state.lastPaid||[]).length>0;\n const h=(has?'\u003cbutton class=\"pay\" onclick=\"payInvoice()\">✅ Paguei a fatura\u003c/button>':'')+(und?'\u003cbutton class=\"undo\" onclick=\"undoPay()\">↩️ Desfazer último pagamento\u003c/button>':'');\n [\"payRow\",\"payRow2\"].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=h})\n}\nasync function payInvoice(){\n const {total}=monthByCat();if(!(total>0))return;\n if(!await showConfirm(\"Pagar a fatura de \"+money(total)+\"? O cartão volta a ficar todo liberado. Os gastos continuam salvos nos relatórios.\"))return;\n const n=new Date(),m=n.getMonth(),y=n.getFullYear(),ids=[];\n state.expenses.forEach(x=>{const d=parseLocalDate(x.date);if(!x.paid&&d.getMonth()===m&&d.getFullYear()===y){x.paid=true;ids.push(x.id)}});\n state.lastPaid=ids;persist();update();toast(\"Fatura paga ✓\")\n}\nfunction undoPay(){\n const ids=state.lastPaid||[];state.expenses.forEach(x=>{if(ids.indexOf(x.id)>=0)delete x.paid});\n state.lastPaid=[];persist();update();toast(\"Pagamento desfeito\")\n}\nfunction openFatura(){showScreen(\"fatura\",null);renderFatura()}\nfunction renderFatura(){\n const n=new Date(),m=n.getMonth(),y=n.getFullYear();const {list,total}=monthByCat();\n document.getElementById(\"faturaTotal\").textContent=money(total);\n const box=document.getElementById(\"faturaList\");\n if(!list.length){box.innerHTML='\u003cdiv class=\"empty\">🐷 Nenhum gasto neste mês.\u003c/div>';return}\n box.innerHTML=list.map(c=>{\n  const items=state.expenses.filter(x=>{const d=parseLocalDate(x.date);return !x.paid&&!x.piggy&&d.getMonth()===m&&d.getFullYear()===y&&(cats[x.category]?x.category:\"other\")===c.k}).sort((a,b)=>parseLocalDate(b.date)-parseLocalDate(a.date));\n  return `\u003cdiv class=\"catHead\">\u003cspan>\u003cspan class=\"legDot\" style=\"background:${catColors[c.k]};display:inline-block;margin-right:6px\">\u003c/span>${cats[c.k].icon} ${cats[c.k].name}\u003c/span>\u003cspan>${money(c.v)}\u003c/span>\u003c/div>\u003cdiv class=\"catBar\">\u003ci style=\"width:${(c.v/total*100).toFixed(1)}%;background:${catColors[c.k]}\">\u003c/i>\u003c/div>${items.map(expenseHTML).join(\"\")}`}).join(\"\")\n}\nfunction setCardLimit(v){const n=parseFloat(String(v).replace(\",\",\".\"));state.cardLimit=(isNaN(n)||n\u003c0)?0:n;persist();renderDonut();renderSaved()}\nfunction setSavedOutside(v){const n=parseFloat(String(v).replace(\",\",\".\"));state.savedOutside=(isNaN(n)||n\u003c0)?0:n;persist();renderSaved()}\nfunction livre(){\n const t=totals(),lim=Number(state.cardLimit||0);\n const card=lim>0?(lim-monthByCat().total):((modoBico()?0:recebidoAteHoje())+extraTotal()-t.monthSpent);\n const piggy=Number(state.savedOutside||0);return{card,piggy,total:card+piggy,lim}\n}\nfunction renderSaved(){\n const i=document.getElementById(\"savedOutside\"),l=document.getElementById(\"cardLimitInput\");\n if(i&&document.activeElement!==i)i.value=state.savedOutside?String(state.savedOutside):\"\";\n if(l&&document.activeElement!==l)l.value=state.cardLimit?String(state.cardLimit):\"\";\n const v=livre(),bal=document.getElementById(\"balance\");if(!bal)return;\n bal.textContent=money(v.total);\n document.getElementById(\"balSplit\").innerHTML=(v.lim>0?\"💳 cartão \":\"💳 mês \")+money(v.card)+\" · 🐷 cofrinho \"+money(v.piggy)+\" \u003ci>(cofrinho separado da fatura)\u003c/i>\"\n}\nfunction setMode(m){state.mode=m;persist();update();toast(m===\"bico\"?\"Modo por aula ativado\":\"Modo CLT ativado\")}\nfunction applyMode(){\n const b=modoBico();\n document.body.classList.toggle(\"bico\",b);\n [\"hourValue\",\"spentTime\"].forEach(id=>{const e=document.getElementById(id);if(e&&e.parentElement)e.parentElement.style.display=b?\"none\":\"\"});\n const w=document.getElementById(\"simRecWrap\");\n if(w){w.style.display=b?\"block\":\"none\";const i=document.getElementById(\"simReceived\");if(i&&!i.dataset.touched)i.value=extraTotal()||\"\"}\n const c=document.getElementById(\"modeCltBtn\"),k=document.getElementById(\"modeBicoBtn\");\n if(c&&k){c.className=\"btn\"+(b?\" secondary\":\"\");k.className=\"btn\"+(b?\"\":\" secondary\")}\n const h=document.getElementById(\"modeHint\");\n if(h)h.textContent=b?\"Modo por aula: você não precisa preencher salário, horas nem datas (ficam guardados). Para saber o peso de uma compra, use o simulador na tela Início.\":\"Modo CLT: informe seu salário, suas horas e as datas de recebimento para calcular o valor da sua hora.\"\n}\ndocument.getElementById(\"simReceived\").addEventListener(\"input\",e=>{e.target.dataset.touched=\"1\"});\nupdate();\ncheckOnboarding();\n// ATALHO RÁPIDO: se o link for aberto com ?valor=50, já abre a tela de\n// adicionar gasto com esse valor preenchido, faltando só nome e categoria.\n// Ex.: index1.html?valor=50 (útil pra atalhos de automação Android/iOS)\n// Ou com ?extra=100 (e opcionalmente &desc=Transferência), abre a aba\n// Extras já com o valor (e descrição, se vier) preenchidos.\nlet ultimoQuickAddProcessado=\"\";\nfunction checkQuickAdd(){\n try{\n  const search=(typeof window.__QS===\"string\"?window.__QS:window.location.search);\n  if(!search||search===ultimoQuickAddProcessado)return;\n  const params=new URLSearchParams(search);\n  let valor=params.get(\"valor\");\n  if(valor)valor=valor.replace(/\\./g,\"\").replace(\",\",\".\").replace(/[^0-9.]/g,\"\");\n  if(valor&&Number(valor)>0&&state.onboardingDone){\n   ultimoQuickAddProcessado=search;\n   setTimeout(()=>{\n    showScreen(\"home\",document.querySelector('[data-screen=home]'));\n    openExpense();\n    document.getElementById(\"expenseAmount\").value=Number(valor);\n    document.getElementById(\"expenseName\").focus();\n   },0);\n   return;\n  }\n  let extra=params.get(\"extra\");\n  if(extra)extra=extra.replace(/\\./g,\"\").replace(\",\",\".\").replace(/[^0-9.]/g,\"\");\n  if(extra&&Number(extra)>0&&state.onboardingDone){\n   ultimoQuickAddProcessado=search;\n   const desc=params.get(\"desc\")||\"\";\n   setTimeout(()=>{\n    showScreen(\"extras\",document.querySelector('[data-screen=extras]'));\n    document.getElementById(\"extraAmount\").value=Number(extra);\n    document.getElementById(\"extraDesc\").value=desc;\n    document.getElementById(\"extraDesc\").focus();\n   },0);\n  }\n }catch(e){}\n}\ncheckQuickAdd();\nwindow.addEventListener(\"pageshow\",checkQuickAdd);\ndocument.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)checkQuickAdd()});\n// PWA: registra o service worker pra funcionar offline (essencial no iPhone)\nif(\"serviceWorker\" in navigator){\n window.addEventListener(\"load\",()=>{\n  navigator.serviceWorker.register(\"service-worker.js\").catch(()=>{});\n });\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>"
};

<script>
(function () {
  'use strict';
  var KEY_AULAS = 'minhas-aulas-v1', KEY_TEMPO = 'mtv_state';
  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), frames = {}, current = 'home';

  // ---------- Iframes (cada app roda isolado: nada de CSS/JS conflitando) ----------
  function build(name) {
    var f = document.createElement('iframe');
    f.id = 'f-' + name;
    f.setAttribute('title', name);
    var html = APPS[name].replace(/<head>/i, '<head><script>window.__QS=' + JSON.stringify(location.search) + ';<\/script>');
    f.srcdoc = html;
    stage.appendChild(f);
    frames[name] = f;
  }
  build('aulas');
  build('tempo');

  // ---------- Navegação ----------
  function show(tab) {
    current = tab;
    document.querySelectorAll('#strip button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    $('#homeView').classList.toggle('on', tab === 'home');
    Object.keys(frames).forEach(function (n) { frames[n].classList.toggle('on', n === tab); });
    if (tab === 'home') renderHome();
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', '#6d28d9');
  }
  document.getElementById('strip').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab);
  });
  window.addEventListener('storage', function () { if (current === 'home') renderHome(); });

  // ---------- Painel de Início (lê os dados dos dois apps) ----------
  function rd(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function money(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function timeText(h) {
    if (!isFinite(h) || h < 0) return '0h 00min';
    var m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'min';
  }

  function aulasData(now) {
    var a = rd(KEY_AULAS), r = { ok: false, pend: 0, devendo: 0, recMes: 0, alunos: 0, aulas: 0, creditos: 0 };
    if (!a || !a.students || !a.entries) return r;
    r.ok = true; r.alunos = a.students.length; r.aulas = (a.classes || []).length;
    var bal = {};
    var cred = 0;
    a.entries.forEach(function (e) { if (e.type === 'debt') bal[e.studentId] = (bal[e.studentId] || 0) + e.amount; else if (e.type === 'payment') bal[e.studentId] = (bal[e.studentId] || 0) - e.amount; else if (e.type === 'pack') cred += e.qty || 0; else if (e.type === 'use') { cred -= e.qty || 1; bal[e.studentId] = (bal[e.studentId] || 0) - (e.settled || 0); } });
    r.creditos = cred;
    a.students.forEach(function (s) { var p = Math.max(0, bal[s.id] || 0); r.pend += p; if (p > 0) r.devendo++; });
    var ym = now.getFullYear() + '-' + pad(now.getMonth() + 1), from = ym + '-01', to = ym + '-31';
    a.entries.forEach(function (e) { if ((e.type === 'payment' || e.type === 'pack') && e.date >= from && e.date <= to) r.recMes += e.amount; });
    return r;
  }

  function pld(s) { if (!s) return new Date(NaN); var p = String(s).split('T')[0].split('-').map(Number); return (p.length === 3 && !p.some(isNaN)) ? new Date(p[0], p[1] - 1, p[2]) : new Date(s); }
  function tempoData(now) {
    var t = rd(KEY_TEMPO), r = { cfg: false, disp: 0, gasto: 0, hv: 0, tempoGasto: 0 };
    if (!t) return r;
    r.cfg = t.onboardingDone === true || !!(t.expenses && t.expenses.length) || !!(t.goals && t.goals.length) || (t.salary && t.salary !== 800);
    if (!r.cfg) return r;
    var pd = t.payDates || [], salary = Number(t.salary || 0);
    if (pd.length) salary = pd.reduce(function (a, b) { return a + Number(b.valor || 0); }, 0);
    var extra = (t.extraIncomes || []).filter(function (x) { var d = x.date ? pld(x.date) : (Number(x.id) ? new Date(Number(x.id)) : now); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).reduce(function (a, b) { return a + Number(b.amount || 0); }, 0);
    var renda = salary + extra;
    var recebido = pd.length ? pd.reduce(function (a, b) { return a + (Number(b.dia) <= now.getDate() ? Number(b.valor || 0) : 0); }, 0) : Number(t.salary || 0);
    if (t.mode === 'bico') recebido = 0;
    r.bico = t.mode === 'bico';
    var gasto = (t.expenses || []).filter(function (x) { var d = pld(x.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); })
      .reduce(function (a, b) { return a + Number(b.amount); }, 0);
    var hv = t.workHours > 0 ? renda / (t.workHours * 4.33) : 0;
    r.gasto = gasto; r.hv = hv; r.disp = recebido + extra - gasto; var lim = Number(t.cardLimit || 0); if (lim > 0) { r.disp = lim - (t.expenses || []).filter(function (x) { var d = pld(x.date); return !x.paid && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).reduce(function (a, b) { return a + Number(b.amount); }, 0); } r.disp += Number(t.savedOutside || 0); r.tempoGasto = hv ? gasto / hv : 0;
    return r;
  }

  function renderHome() {
    var now = new Date(), a = aulasData(now), t = tempoData(now);
    var h = now.getHours(), g = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    var html = '<div class="hero"><small>' + g + '! Seu mês em um só lugar.</small><h1>Visão geral</h1><div class="tiles">' +
      '<div class="tile"><small>A receber dos alunos</small><b class="' + (a.pend > 0 ? 'red' : 'ok') + '">' + money(a.pend / 100) + '</b></div>' +
      '<div class="tile"><small>Recebido das aulas no mês</small><b class="ok">' + money(a.recMes / 100) + '</b></div>' +
      '<div class="tile"><small>Disponível neste mês</small><b>' + (t.cfg ? money(t.disp) : '—') + '</b></div>' +
      '<div class="tile"><small>Gastos no mês</small><b>' + (t.cfg ? money(t.gasto) : '—') + '</b></div></div></div>';

    html += '<div class="mod"><h2>🎾 Minhas Aulas</h2><p>' + a.aulas + (a.aulas === 1 ? ' aula' : ' aulas') + ' · ' + a.alunos + (a.alunos === 1 ? ' aluno' : ' alunos') +
      ' · ' + a.devendo + ' devendo · 🎟 ' + a.creditos + (a.creditos === 1 ? ' aula paga' : ' aulas pagas') + '</p><div class="row"><button class="btn" data-go="aulas">Abrir Aulas</button><button class="btn sec" data-go="aulas-pay">💰 Receber</button></div></div>';

    if (t.cfg) {
      html += '<div class="mod"><h2>🐷 Meu Tempo Vale</h2><p>' + (t.bico ? 'Você gastou ' + money(t.gasto) + ' neste mês' : 'Sua hora vale ' + money(t.hv) + ' · você já gastou ' + timeText(t.tempoGasto) + ' de trabalho neste mês') + '</p>' +
        '<div class="row"><button class="btn" data-go="tempo">Abrir Meu Tempo</button><button class="btn sec" data-go="tempo-add">＋ Gasto</button></div></div>';
    } else {
      html += '<div class="mod"><h2>🐷 Meu Tempo Vale</h2><p>Configure seu perfil para ver quanto cada gasto custa do seu tempo.</p>' +
        '<div class="row"><button class="btn" data-go="tempo">Configurar agora</button></div></div>';
    }
    html += '<div class="note">Os dados continuam salvos só neste aparelho. Os backups de cada módulo ficam em Aulas › Resumo e Meu Tempo › Ajustes.</div>';
    $('#homeBody').innerHTML = html;
  }

  $('#homeBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (!b) return;
    var go = b.dataset.go;
    if (go === 'aulas' || go === 'aulas-pay') { show('aulas'); return; }
    show('tempo');
    if (go === 'tempo-add') {
      try {
        var w = frames.tempo.contentWindow;
        if (w.eval('state.onboardingDone')) {
          w.showScreen('home', w.document.querySelector('[data-screen=home]'));
          w.openExpense();
        }
      } catch (x) {}
    }
  });

  // Atalho rápido do Meu Tempo (?valor=50 ou ?extra=100) abre direto no módulo certo
  var start = 'home';
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('valor') || qs.get('extra')) start = 'tempo';
  } catch (e) {}
  show(start);

  // PWA: instalação e offline (só funciona quando o arquivo é aberto por um endereço https, como o GitHub Pages)
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function () {}); });

  // Back do Android: se estiver em Aulas/Tempo sem histórico interno, volta ao Início
  window.__shell = { show: show };
})();
</script>
